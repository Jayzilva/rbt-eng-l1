# Public site for ENG-L1-M01. Preview: pip install mkdocs-material && mkdocs serve
# Published by the track repo's Pages workflow at <track site>/m01-code-quality-testing/
site_name: "ENG-L1-M01 — Code Quality & Testing"
site_description: "Test an untested React + TypeScript component library with Jest, React Testing Library and Cypress; reach 80% coverage and fix seeded bugs test-first."
repo_url: "https://github.com/Jayzilva/rbt-eng-l1"
edit_uri: "edit/main/m01-code-quality-testing/docs/"
docs_dir: docs

# Only public material is published. Planning and scoring files paraphrase academy sources.
exclude_docs: |
  plan.md
  self-score.md
  deliverables/
  media/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Syllabus:
      - Overview: syllabus/index.md
      - "01 · Testing Pyramid and Testing Trophy": syllabus/01-testing-pyramid.md
      - "02 · Jest Basics": syllabus/02-jest-basics.md
      - "03 · Code Coverage": syllabus/03-code-coverage.md
      - "04 · Typing React Props Under Strict Mode": syllabus/04-typescript-props.md
      - "05 · React Testing Library": syllabus/05-react-testing-library.md
      - "06 · user-event": syllabus/06-user-event.md
      - "07 · Jest mocking": syllabus/07-mocking.md
      - "08 · Async tests and fake timers": syllabus/08-async-and-fake-timers.md
      - "09 · Arrange-Act-Assert and Testing Behaviour": syllabus/09-aaa-and-behaviour.md
      - "10 · Test-Driven Development: Red, Green, Refactor": syllabus/10-tdd.md
      - "11 · Accessibility for Components": syllabus/11-accessibility.md
      - "12 · End-to-End Testing with Cypress": syllabus/12-cypress-e2e.md
  - Resources: resources.md
  - Design notes: design-notes.md
  - Study notes: notes.md
  - Write-up: PUBLIC.md
  - Build log: build-log.md
