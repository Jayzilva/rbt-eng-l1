name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material "mkdocs<2"
      - name: Confidentiality check (internal URLs and passwords)
        run: |
          set -e
          for m in m*/; do
            [ -f "$m/mkdocs.yml" ] || continue
            files=$(find "$m/docs" -name '*.md' -not -path '*/deliverables/*' -not -path '*/media/*' -not -name plan.md -not -name self-score.md)
            (cd "$m" && node tools/check-public.mjs $(echo "$files" | sed "s#^$m##"))
          done
      - run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
